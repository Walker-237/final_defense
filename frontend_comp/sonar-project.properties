sonar.projectKey=bello
sonar.projectName=frontend
sonar.host.url=http://localhost:9000
# Le token n'est PAS stocké ici : le passer au scan via
#   sonar-scanner -Dsonar.token=$SONAR_TOKEN   (ou la variable d'env SONAR_TOKEN)

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/.angular/**

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info

# Amorçage / configuration : aucun code métier à couvrir par des tests unitaires.
# Ces fichiers restent analysés (qualité, hotspots) mais sortent du dénominateur
# de couverture, sinon ils diluent artificiellement le taux.
sonar.coverage.exclusions=\
  src/main.ts,\
  src/main.server.ts,\
  src/server.ts,\
  src/app/app.config.ts,\
  src/app/app.config.server.ts,\
  src/app/app.routes.ts,\
  src/app/app.routes.server.ts,\
  src/environments/**,\
  src/app/shared/afriland-logo.ts
